name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build and Test (iOS)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.3'  # өзіңізге сәйкес нұсқаны қойыңыз

      - name: Install dependencies (CocoaPods болса)
        run: |
          brew install cocoapods
          pod install || true

      - name: Build & Test
        run: |
          xcodebuild test \
            -project TaskTracker.xcodeproj \
            -scheme TaskTracker \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -enableCodeCoverage YES | xcpretty
